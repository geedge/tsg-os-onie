stages:
  - build

image: "git.mesalab.cn:7443/mesa_platform/build-env:onie-build-env"
variables:
  GIT_STRATEGY: "clone"

.build_by_travis:
  script:
    - env | sort
    - git config --global user.email "build@example.com"
    - git config --global user.name "build"
    - whoami
    - cd ${PROJECT_DIR}/build-config
    #- make -j4 MACHINEROOT=../machine/geedge MACHINE=${MACHINE_NAME} all
    - mkdir -p ${PROJECT_DIR}/build/images/
    - echo "test" >> ${PROJECT_DIR}/build/images/test.log
    - pwd
    - ls -ahl ${PROJECT_DIR}/
    - ls -ahl ${PROJECT_DIR}/build/
    - ls -ahl ${PROJECT_DIR}/build/images/
    - tar -zcvf ${PROJECT_DIR}/TSG-ONIE-${MACHINE_NAME}-$CI_COMMIT_REF_NAME.tar.gz ${PROJECT_DIR}/build/images/
    - ls -ahl ${PROJECT_DIR}/
    - python ${PROJECT_DIR}/ci/file_upload_tools.py ${PULP3_FILE_REPO_NAME} ${PULP3_FILE_DIST_NAME} ${PROJECT_DIR}/TSG-OINE-*.tar.gz
  tags:
    - tsg-os-installer
 
release-TSG-7400-ONIE:
  stage: build
  extends: .build_by_travis
  variables:
    PULP3_FILE_REPO_NAME: onie-os-images-release
    PULP3_FILE_DIST_NAME: onie-os-images-release
    MACHINE_NAME: 7400-MCN-P01R01
    PROJECT_DIR: "/builds/tsg/tsg-os-onie"
  only:
    - /^rel-.*$/i

release-TSG-9140-ONIE:
  stage: build
  extends: .build_by_travis
  variables:
    PULP3_FILE_REPO_NAME: onie-os-images-release
    PULP3_FILE_DIST_NAME: onie-os-images-release
    MACHINE_NAME: 9000-NPB-P01R01
  only:
    - /^rel-.*$/i